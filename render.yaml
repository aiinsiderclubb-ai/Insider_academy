# Insider Academy — Render Blueprint (synced with production layout)
# Live API: https://insider-academy.onrender.com (Virginia)
# Frontend: Vercel https://myinsideracademy.com
#
# After apply: set all sync:false secrets in Dashboard (see docs/LAUNCH_CHECKLIST.md)

services:
  - type: web
    name: insider-academy
    runtime: node
    plan: starter
    region: virginia
    branch: main
    buildCommand: cd server && npm ci
    startCommand: cd server && node index.js
    healthCheckPath: /api/health/ready
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - server/**
        - src/data/**
    envVars:
      - key: PRELAUNCH_MODE
        value: "1"
      - key: GIVEAWAY_CLAUDE_ENDS_AT
        value: "2026-07-25T23:59:59+03:00"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: insider-academy-db
          property: connectionString
      - key: PGSSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: EDITOR_PASSWORD
        sync: false
      - key: MODERATOR_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: AI Insider Academy <info@myinsideracademy.com>
      - key: CORS_ORIGIN
        value: https://myinsideracademy.com,https://www.myinsideracademy.com,https://insiderai.it.com,https://www.insiderai.it.com,https://insider-academy-vsxg.vercel.app,https://insider-academy.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: APP_URL
        value: https://myinsideracademy.com
      - key: STORAGE_DRIVER
        value: local
      - key: UPLOADS_DIR
        value: /opt/render/project/src/server/uploads
      - key: TRIBUTE_CURRENCY
        value: eur
      - key: TRIBUTE_DEFAULT_PRODUCT_ID
        value: "65858"
      - key: TRIBUTE_PRODUCT_MAP
        value: '{"ai-agency-builder":126606,"ai-start":65858}'
      - key: TRIBUTE_WEBHOOK_URL
        value: https://insider-academy.onrender.com/api/webhooks/tribute
      - key: TRIBUTE_API_KEY
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: "1JlbsIBxryW8dSemF4XSySdcVabqwxghh"
      - key: GOOGLE_SHEETS_ENABLED
        value: "1"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: InsiderAcademyNotifyBot
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        value: https://insider-academy.onrender.com/api/telegram/webhook
      - key: API_PUBLIC_URL
        value: https://insider-academy.onrender.com
      - key: TELEGRAM_BOT_SERVICE_URL
        value: https://insider-academy-notify-bot.onrender.com
      - key: TELEGRAM_BOT_SERVICE_SECRET
        sync: false
      - key: BOT_SERVICE_SECRET
        sync: false

  - type: web
    name: insider-academy-notify-bot
    runtime: node
    plan: starter
    region: virginia
    branch: main
    rootDir: telegram-notify-bot
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - telegram-notify-bot/**
    envVars:
      - key: TELEGRAM_BOT_USERNAME
        value: InsiderAcademyNotifyBot
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_SERVICE_SECRET
        sync: false
      - key: LMS_API_URL
        value: https://insider-academy.onrender.com
      - key: BOT_PUBLIC_URL
        value: https://insider-academy-notify-bot.onrender.com

databases:
  - name: insider-academy-db
    plan: basic-256mb
    region: virginia
    databaseName: lms_h8w8
    postgresMajorVersion: "16"
    ipAllowList: []
