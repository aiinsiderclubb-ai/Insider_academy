# Insider Academy — Render Blueprint
# Repo: https://github.com/aiinsiderclubb-ai/Insider_academy
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo → Apply
# After deploy, set secrets marked sync: false in the Dashboard (see .env.example).

services:
  # ── Backend API (Node.js / Express) ──────────────────────────────────────
  - type: web
    name: insider-academy-api
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm ci --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - server/**
        - src/data/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: insider-academy-db
          property: connectionString
      - key: PGSSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: EDITOR_PASSWORD
        sync: false
      - key: MODERATOR_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGIN
        value: https://insider-academy-vsxg.vercel.app
      - key: APP_URL
        value: https://insider-academy-vsxg.vercel.app
      - key: STORAGE_DRIVER
        value: local
      - key: UPLOADS_DIR
        value: /opt/render/project/src/server/uploads
      - key: TRIBUTE_CURRENCY
        value: eur
      - key: TRIBUTE_DEFAULT_PRODUCT_ID
        value: "65858"
      - key: TRIBUTE_WEBHOOK_URL
        value: https://insider-academy.onrender.com/api/webhooks/tribute
      - key: TRIBUTE_API_KEY
        sync: false

  # ── Frontend (Vite / React static site) ──────────────────────────────────
  - type: web
    name: insider-academy
    runtime: static
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://insider-academy-api.onrender.com/api

databases:
  - name: insider-academy-db
    plan: basic-256mb
    region: frankfurt
    databaseName: lms
    user: lms
    postgresMajorVersion: "16"
    ipAllowList: []
