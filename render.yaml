# Insider Academy — Render Blueprint
# Repo: https://github.com/aiinsiderclubb-ai/Insider_academy
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo → Apply
# After deploy, set secrets marked sync: false in the Dashboard (see .env.example).

services:
  # ── Backend API (Node.js / Express) ──────────────────────────────────────
  - type: web
    name: insider-academy-api
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm ci --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - server/**
        - src/data/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: insider-academy-db
          property: connectionString
      - key: PGSSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: EDITOR_PASSWORD
        sync: false
      - key: MODERATOR_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: AI Insider Academy <info@myinsideracademy.com>
      - key: CORS_ORIGIN
        value: https://myinsideracademy.com,https://www.myinsideracademy.com,https://insiderai.it.com,https://www.insiderai.it.com,https://insider-academy-vsxg.vercel.app,https://insider-academy.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: APP_URL
        value: https://myinsideracademy.com
      - key: STORAGE_DRIVER
        value: local
      - key: UPLOADS_DIR
        value: /opt/render/project/src/server/uploads
      - key: TRIBUTE_CURRENCY
        value: eur
      - key: TRIBUTE_DEFAULT_PRODUCT_ID
        value: "65858"
      - key: TRIBUTE_PRODUCT_MAP
        value: '{"ai-agency-builder":126606}'
      - key: TRIBUTE_WEBHOOK_URL
        value: https://insider-academy.onrender.com/api/webhooks/tribute
      - key: TRIBUTE_API_KEY
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: "1JlbsIBxryW8dSemF4XSySdcVabqwxghh"
      - key: GOOGLE_SHEETS_ENABLED
        value: "1"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: InsiderAcademyNotifyBot
      - key: TELEGRAM_WEBHOOK_URL
        value: https://insider-academy.onrender.com/api/telegram/webhook
      - key: API_PUBLIC_URL
        value: https://insider-academy.onrender.com
      - key: TELEGRAM_BOT_SERVICE_URL
        value: https://insider-academy-notify-bot.onrender.com
      - key: TELEGRAM_BOT_SERVICE_SECRET
        value: "0e4a1374271a72377b84dfc5191df55d62bd6b118e5eb569"
      - key: BOT_SERVICE_SECRET
        value: "0e4a1374271a72377b84dfc5191df55d62bd6b118e5eb569"

  # ── Telegram notify bot ───────────────────────────────────────────────────
  - type: web
    name: insider-academy-notify-bot
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    rootDir: telegram-notify-bot
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - telegram-notify-bot/**
    envVars:
      - key: TELEGRAM_BOT_USERNAME
        value: InsiderAcademyNotifyBot
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_SERVICE_SECRET
        sync: false
      - key: LMS_API_URL
        value: https://insider-academy.onrender.com
      - key: BOT_PUBLIC_URL
        value: https://insider-academy-notify-bot.onrender.com

  # ── Frontend (Vite / React static site) ──────────────────────────────────
  - type: web
    name: insider-academy
    runtime: static
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /api/*
        destination: https://insider-academy.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: /api
      - key: VITE_ACADEMY_URL
        value: https://myinsideracademy.com
      - key: VITE_TELEGRAM_NOTIFY_BOT_USERNAME
        value: InsiderAcademyNotifyBot

databases:
  - name: insider-academy-db
    plan: basic-256mb
    region: frankfurt
    databaseName: lms
    user: lms
    postgresMajorVersion: "16"
    ipAllowList: []
