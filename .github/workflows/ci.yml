name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-chars-long
      ADMIN_JWT_SECRET: ci-admin-jwt-secret-32-chars-minimum
      ADMIN_PASSWORD: ci-admin-strong-pass-1
      EDITOR_PASSWORD: ci-editor-strong-pass-1
      MODERATOR_PASSWORD: ci-mod-strong-pass-1
      TRIBUTE_API_KEY: ci-tribute-test-key-for-hmac-signing
      TRIBUTE_WEBHOOK_SKIP_VERIFY: '0'
      TRIBUTE_PRODUCT_MAP: '{"ai-start":65858}'
      PRELAUNCH_MODE: '1'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build (Vite)
        run: npm run build

      - name: Server integration tests
        run: npm test --prefix server

      - name: Server production dependency audit
        run: npm audit --omit=dev --audit-level=high --prefix server

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: E2E tests
        run: npm run test:e2e
