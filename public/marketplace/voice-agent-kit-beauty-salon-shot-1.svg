<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d"><title id="t">Beauty Salon Voice Agent call flow</title><desc id="d">Verified product preview showing booking call states</desc><rect width="1440" height="900" fill="#0b0a10"/><text x="72" y="86" fill="#b98cff" font-family="monospace" font-size="18" letter-spacing="4">VOICE AGENT KIT / CALL FLOW</text><text x="72" y="160" fill="#fff" font-family="Arial" font-size="54" font-weight="700">Запись клиента без пропущенных звонков</text><g font-family="Arial" font-size="22"><g transform="translate(72 260)"><rect width="280" height="190" rx="12" fill="#17131d" stroke="#453654"/><text x="28" y="52" fill="#fff" font-weight="700">01 · Приветствие</text><text x="28" y="96" fill="#aaa1b4">Услуга · мастер</text><text x="28" y="132" fill="#aaa1b4">язык · намерение</text></g><g transform="translate(405 260)"><rect width="280" height="190" rx="12" fill="#17131d" stroke="#453654"/><text x="28" y="52" fill="#fff" font-weight="700">02 · Слот</text><text x="28" y="96" fill="#aaa1b4">check_slot()</text><text x="28" y="132" fill="#64dfc4">calendar connected</text></g><g transform="translate(738 260)"><rect width="280" height="190" rx="12" fill="#17131d" stroke="#453654"/><text x="28" y="52" fill="#fff" font-weight="700">03 · Запись</text><text x="28" y="96" fill="#aaa1b4">create_booking()</text><text x="28" y="132" fill="#64dfc4">consent logged</text></g><g transform="translate(1071 260)"><rect width="280" height="190" rx="12" fill="#17131d" stroke="#453654"/><text x="28" y="52" fill="#fff" font-weight="700">04 · Follow-up</text><text x="28" y="96" fill="#aaa1b4">SMS confirmation</text><text x="28" y="132" fill="#aaa1b4">human handoff</text></g></g><path d="M352 355h53m280 0h53m280 0h53" stroke="#b98cff" stroke-width="3"/><rect x="72" y="540" width="1279" height="250" rx="14" fill="#111017" stroke="#2d2934"/><text x="108" y="600" fill="#fff" font-family="Arial" font-size="24" font-weight="700">Пример системного правила</text><text x="108" y="652" fill="#bcb4c6" font-family="monospace" font-size="20">Если слот занят → предложить 2 ближайших альтернативы.</text><text x="108" y="696" fill="#bcb4c6" font-family="monospace" font-size="20">Если запрос медицинский → не давать совет, передать человеку.</text><text x="108" y="740" fill="#bcb4c6" font-family="monospace" font-size="20">Перед записью → повторить дату, время, услугу и получить подтверждение.</text></svg>
