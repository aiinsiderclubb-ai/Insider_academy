server {
  listen 80;
  client_max_body_size 25M;

  location /api/ {
    proxy_pass http://api:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    proxy_pass http://web:80/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
